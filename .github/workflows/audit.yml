name: Audit

# Catch package files that changed or disappeared after they were published
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Verify every file
        run: uv run --locked ccpm-registry verify
